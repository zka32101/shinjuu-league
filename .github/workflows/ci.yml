name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # channel:stable（バージョン指定なし）だとGitHubランナー側のFlutterが
          # 更新されるたびにDart SDKも自動的に前進し、pubspec.lockでロック済みの
          # analyzer（riverpod_generator/build_runner等が使う推移的依存）が
          # 内部でサポートする言語バージョンを超えてクラッシュ/ハングする問題が
          # 発生した（詳細はgit log参照）。pubspec.yamlのsdk制約(^3.12.2)ちょうど
          # に対応するFlutterバージョンへ固定し、ロック済み依存関係との整合性を保つ。
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (json_serializable, etc.)
        timeout-minutes: 5
        # stdinをリダイレクトしないと、CI(TTY無し)環境でbuild_runnerが
        # 何らかのプロンプト待ちで無期限にハングすることがある
        # （--delete-conflicting-outputsを付けてもなお発生しうる既知の問題）。
        # 過去のCI実行がすべてこのステップで6時間のジョブタイムアウトまで
        # ハングし続けていたため、明示的にEOFを渡して確実に非対話実行させ、
        # 万一再発してもジョブ全体を長時間占有しないようステップ単位でも
        # タイムアウトを設定する。
        run: dart run build_runner build --delete-conflicting-outputs < /dev/null

      - name: Apply formatting
        run: dart format --output=none lib test

      - name: Commit formatting changes if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git config user.name "Claude Code"
            git config user.email "noreply@anthropic.com"
            git add -A
            git commit -m "style: apply dart formatting"
            # Get the branch name from GITHUB_HEAD_REF (for PRs) or GITHUB_REF_NAME
            BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push --force origin HEAD:$BRANCH
          fi

      - name: Analyze
        # Only fail CI on real analyzer errors. `flutter analyze` treats
        # both warning- and info-level issues as fatal by default, and
        # the test suite has accumulated a long tail of style-level
        # warnings (unused variables/imports, deprecated_member_use)
        # that don't indicate broken code and aren't worth blocking
        # merges over. Note: the "cast from null always fails" warnings
        # on mockito any/anyNamed/argThat casts ARE real bugs (those
        # casts throw at runtime) and are tracked/fixed separately via
        # `flutter test` failures, not via this analyze gate.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Provide placeholder Firebase config for Android build
        # google-services.json is intentionally gitignored (real Firebase
        # credentials, see .gitignore "DO NOT COMMIT" section) and is never
        # checked into this repo. The com.google.gms.google-services Gradle
        # plugin still requires *a* file matching the app's package name to
        # exist at build time (validated against real Firebase project data
        # only at app runtime, not at build time), so CI writes a
        # structurally-valid but fake one just to let the APK compile/package
        # for verification purposes. It must never be used for a real release.
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.petitworksapps.shinjukuleague"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI0000000000000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Android APK (release, verification only)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
